[project]
name = "renderer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["renderer*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

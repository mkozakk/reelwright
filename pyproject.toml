[project]
name = "renderer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "moto[dynamodb,s3,stepfunctions]>=5",
]
services = [
    "boto3>=1.34",
    "cryptography>=42",
    "aws-xray-sdk>=2.14",
]
transcribe = [
    "faster-whisper>=1.0",
]

[tool.setuptools.packages.find]
include = ["renderer*", "services*"]

[tool.pytest.ini_options]
markers = [
    "media: requires ffmpeg/ffprobe and sample assets",
    # not run by default CI -- run manually with `pytest -m whisper`
    "whisper: requires faster-whisper and baked model weights",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
